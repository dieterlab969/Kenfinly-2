# Kenfinly 2 only. Preserve other sites and the existing default listeners.
log_format kenfinly2_home '$time_iso8601 peer=$remote_addr trace=$http_x_request_id '
    'client=$http_x_forwarded_for scheme=$http_x_forwarded_proto '
    '"$request_method $uri $server_protocol" status=$status '
    'root=$realpath_root upstream=$upstream_addr';

server {
    listen 10.0.0.2:18082;
    listen 127.0.0.1:18082;
    server_name my.kenfinly.com;
    if ($host != my.kenfinly.com) { return 444; }
    allow 10.0.0.1;
    allow 127.0.0.1;
    deny all;
    root /var/www/kenfinly-2-deploy/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 100m;
    access_log /var/log/nginx/kenfinly2.access.log kenfinly2_home;
    error_log /var/log/nginx/kenfinly2.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:19084;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}

# Kenfinly 2 public boundary. Never append an untrusted incoming forwarding chain.
log_format kenfinly2_edge '$time_iso8601 client=$remote_addr trace=$request_id '
    '"$request_method $uri $server_protocol" status=$status upstream=$upstream_addr';

server {
    listen 80;
    server_name my.kenfinly.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kenfinly-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://my.kenfinly.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name my.kenfinly.com;
    ssl_certificate /etc/letsencrypt/live/my.kenfinly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.kenfinly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 100m;
    access_log /var/log/nginx/kenfinly2-edge.access.log kenfinly2_edge;
    error_log /var/log/nginx/kenfinly2-edge.error.log warn;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    location / {
        proxy_pass http://10.0.0.2:18082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host my.kenfinly.com;
        proxy_set_header X-Forwarded-Host my.kenfinly.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-URL "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

[global]
pid = /run/kenfinly-fpm/php-fpm.pid
error_log = /var/www/kenfinly-2-deploy/shared/storage/logs/php-fpm.log
daemonize = no

[kenfinly]
listen = 127.0.0.1:19084
listen.allowed_clients = 127.0.0.1
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500
chdir = /var/www/kenfinly-2-deploy/current
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 100M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/kenfinly-2-deploy/shared/storage/logs/php-error.log
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off

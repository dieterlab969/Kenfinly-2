# Insert into the existing build.getkenka.com HTTPS server on the VPS.
# Keep its existing authenticated Jenkins UI/proxy and all certificate settings.
# The shared endpoint must use this gateway; a second unfiltered hook path would
# allow Kenfinly to bypass its repository-specific signature policy.
location ^~ /github-webhook {
    limit_except POST { deny all; }
    client_max_body_size 10m;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:19093;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host build.getkenka.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
}

# Temporary ACME preparation for this hostname only; no application over HTTP.
server {
    listen 80;
    server_name my.kenfinly.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kenfinly-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}

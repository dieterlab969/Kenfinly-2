name: KENFINLY CI

on:
  push:
    branches: [develop, deploy/my-kenfinly]
  pull_request:
    branches: [develop, deploy/my-kenfinly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kenfinly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'dieterlab969/Kenfinly-2'
    name: Locked install, tests and assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: default
      DB_PASSWORD: password
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
      RUNS_SCHEDULER: 'false'

    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: default
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, mbstring, pdo_mysql, sockets, xml, zip
          coverage: none
          tools: composer:2.10.0
        env:
          fail-fast: 'true'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure disposable application environment
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          test ! -e .env
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, secrets
          overrides = {
              'APP_ENV': 'testing',
              'APP_KEY': 'base64:' + base64.b64encode(secrets.token_bytes(32)).decode(),
              'DB_PORT': os.environ['MYSQL_PORT'],
              'MAIL_MAILER': 'array',
              'QUEUE_CONNECTION': 'sync',
              'CACHE_STORE': 'array',
              'SESSION_DRIVER': 'array',
              'RUNS_SCHEDULER': 'false',
          }
          lines = []
          for line in Path('.env.ci').read_text().splitlines():
              key = line.split('=', 1)[0]
              lines.append(key + '=' + overrides.pop(key) if key in overrides else line)
          lines.extend(key + '=' + value for key, value in overrides.items())
          Path('.env').write_text('\n'.join(lines) + '\n')
          Path('.env').chmod(0o600)
          PY
          php --version
          node --version
          composer --version

      - name: Install locked PHP dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          composer check-platform-reqs
          composer run-script post-autoload-dump --no-interaction
          php artisan config:clear --no-interaction

      - name: Install locked frontend dependencies
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: 'git@github.com:'
        run: npm ci --no-audit --no-fund

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build frontend assets
        run: npm run build

      - name: Run existing PHP unit and feature tests
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: php -d memory_limit=1G vendor/bin/pest --compact --colors=never

      - name: Verify dependency locks are unchanged
        run: git diff --exit-code -- composer.lock package-lock.json

      - name: Record CI identity
        if: always()
        run: |
          printf 'Commit: `%s`\n\nRef: `%s`\n\nCI only; deployment is handled by Jenkins from deploy/my-kenfinly.\n' \
            "$GITHUB_SHA" "$GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
